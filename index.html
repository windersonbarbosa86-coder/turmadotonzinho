<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Turma do Tonzinho</title>
<style>
body {
    margin: 0;
    font-family: Comic Sans MS, Arial;
    background: url('backgroundsitetdz.gif');
    animation: bgmove 20s linear infinite;
}@keyframes bgmove { from {background-position: 0 0;} to {background-position: 500px 500px;} }

#container { width: 1000px; margin: auto; }

#banner { height: 150px; background: url('banner.gif'); border: 5px solid black; }

#topbar { display: flex; margin-top: 10px; }

#logo { width: 150px; height: 50px; background: white; border: 3px solid black; }

#pagetitle { flex: 1; height: 50px; border: 3px solid black; text-align: center; line-height: 50px; font-size: 20px; background: #fff; }

#main { display: flex; margin-top: 10px; }

#sidebar { width: 200px; }

.button { height: 50px; border: 3px solid black; margin-bottom: 10px; text-align: center; line-height: 50px; background: #ccc; cursor: pointer; }

.button:hover { background: yellow; }

#content { flex: 1; height: 500px; border: 5px solid black; margin-left: 10px; text-align: center; padding-top: 50px; background: white; }

#stamps { margin-top: 20px; height: 200px; border: 3px solid black; background: #eee; }

.gif { width: 80px; }

</style>
</head>
<body><div id="container"><div id="banner"></div><div id="topbar">
    <div id="logo"></div>
    <div id="pagetitle">Página Inicial</div>
</div><div id="main"><div id="sidebar">
    <div class="button">Início</div>
    <div class="button">Personagens</div>
    <div class="button">Jogos</div>
    <div class="button">Animações</div>
    <div class="button">Downloads</div><div id="stamps">
    <img src="stamp1.gif" class="gif">
    <img src="stamp2.gif" class="gif">
    <img src="stamp3.gif" class="gif">
</div>

</div><div id="content">
    <h1>BEM-VINDO À TURMA DO TONZINHO!</h1>
    <p>Aqui você encontra jogos, animações e muita diversão!</p><img src="animacao1.gif" width="200">
<img src="animacao2.gif" width="200">

<br><br>

<audio controls autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

</div></div></div></body>
</html>
